# Acopio · servicios base. Desarrollo: combinar con docker-compose.dev.yml.
# En el servidor, Traefik (Dokploy) enruta el dominio hacia `web`, que reenvía /api a `api`.
name: acopio

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acopio_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-acopio}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?falta APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    # Garage, compatible con S3 (ADR-0012). Reemplaza a MinIO, que dejó de publicar
    # imágenes. Primera vez: bun run almacenamiento:iniciar
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?falta GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?falta GARAGE_ADMIN_TOKEN}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PUERTO: 3000
      APP_URL: ${APP_URL:?falta APP_URL}
      DATABASE_URL: postgresql://acopio_app:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-acopio}
      DATABASE_URL_OWNER: postgresql://${POSTGRES_USER:-acopio_owner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-acopio}
      AUTH_PROVEEDOR: ${AUTH_PROVEEDOR:-supabase}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:?falta SUPABASE_JWKS_URL}
      AUTH_LLAVES_DIR: /llaves
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      S3_ENDPOINT: http://storage:3900
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET: ${S3_BUCKET:-comprobantes}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?falta S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?falta S3_SECRET_KEY}
      # false: sin correo; las invitaciones se comparten con el enlace de la consola (P-055)
      CORREO_ACTIVO: ${CORREO_ACTIVO:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SEGURO: ${SMTP_SEGURO:-false}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-}
      SEED_ADMIN_USUARIO: ${SEED_ADMIN_USUARIO:-admin}
      SEED_ADMIN_NOMBRE: ${SEED_ADMIN_NOMBRE:-Administrador}
      SEED_ADMIN_CORREO: ${SEED_ADMIN_CORREO:-}
      SEED_ADMIN_CONTRASENA: ${SEED_ADMIN_CONTRASENA:-}
      # Antes de levantar la API (apps/api/arrancar.sh). En el servidor, true
      MIGRAR_AL_ARRANCAR: ${MIGRAR_AL_ARRANCAR:-false}
      SEMBRAR_AL_ARRANCAR: ${SEMBRAR_AL_ARRANCAR:-false}
      # La demo (seed:demo) en cada arranque; en producción pide DEMO_CONTRASENA
      SEMBRAR_DEMO_AL_ARRANCAR: ${SEMBRAR_DEMO_AL_ARRANCAR:-false}
      DEMO_CONTRASENA: ${DEMO_CONTRASENA:-}
    volumes:
      - llaves:/llaves
    # Nombre propio para el nginx de `web`. En Dokploy, `web` también está en la red compartida,
    # donde otro servicio puede llamarse `api`. El alias solo existe en la red de este Compose
    networks:
      default:
        aliases: [acopio-api]

  web:
    # nginx con el build de Vite; /api va a la API por la red interna (ADR-0014)
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api

volumes:
  llaves:
  pgdata:
  garagemeta:
  garagedata:

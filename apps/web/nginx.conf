# La web y la API en un solo origen: la cookie de sesión es SameSite=Strict con Path=/api
# y la API rechaza escrituras desde un Origin distinto de APP_URL (ADR-0014).

# La API confía en un salto de proxy (trust proxy 1). Detrás de Traefik se reenvía la IP
# que él puso; sin Traefik, la de quien se conectó. Así el límite por IP ve al cliente
map $http_x_forwarded_for $ip_cliente {
  ''      $remote_addr;
  default $http_x_forwarded_for;
}
map $http_x_forwarded_proto $protocolo {
  ''      $scheme;
  default $http_x_forwarded_proto;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Facturas y fotos de recepción: hasta 8 MB en la API (TAMANO_MAXIMO)
  client_max_body_size 9m;

  # El DNS de Docker se consulta en cada petición: al volver a desplegar, la API cambia
  # de IP, y nginx no arranca si la API todavía no existe
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:3000;

  location /api/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $ip_cliente;
    proxy_set_header X-Forwarded-Proto $protocolo;
    proxy_read_timeout 60s;
  }

  # Con hash en el nombre: no cambian nunca
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # El service worker y el HTML se revisan en cada visita, o la web se queda en una versión vieja
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}

<title>Cola de correo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
/* Plano técnico en tema claro fijo, como paquetes.html y el Word. */
:root {
  --bg: #F7F8F7;
  --fg: #1F2624;
  --muted: #5B6662;
  --pkg: #ECEFEE;
  --pkg-line: #9AA6A2;
  --accent: #0F6E6E;
  --accent-soft: #D7ECEC;
  --sans: 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;
  --mono: 'IBM Plex Mono', Consolas, 'Courier New', monospace;
  color-scheme: light;
}
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.55; }
.hoja { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 48px; display: grid; gap: 28px; }
header { display: grid; gap: 6px; max-width: 72ch; }
.ceja { font: 600 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0; font-size: 30px; line-height: 1.15; text-wrap: balance; }
p { margin: 0; max-width: 72ch; }
code { font-family: var(--mono); font-size: .92em; }
figure { margin: 0; display: grid; gap: 12px; }
.lamina { overflow-x: auto; border: 1px solid var(--pkg-line); border-radius: 6px; background: var(--bg); }
.lamina svg { display: block; width: 100%; min-width: 900px; height: auto; color: var(--fg); }
figcaption p { color: var(--muted); }
</style>

<div class="hoja">
  <header>
    <span class="ceja">Complemento del segundo corte · Concurrencia</span>
    <h1>Cola de correo: productores y consumidor</h1>
    <p>Los servicios que necesitan mandar un correo no lo envían: lo dejan en la tabla <code>correo_saliente</code> dentro de su propia transacción. Una tarea programada lo envía después, por Resend.</p>
  </header>

  <figure>
    <div class="lamina">
      <svg viewBox="0 0 1240 690" role="img" aria-label="Cuatro servicios productores insertan correos en la tabla correo_saliente dentro de la transacción de su operación y responden al cliente sin esperar. Cada minuto el consumidor procesarCola toma hasta 50 correos listos, los envía a Resend por SMTP y marca cada uno ENVIADO o FALLIDO con una espera creciente.">
        <defs>
          <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
          <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E6E"/></marker>
        </defs>

        <!-- encabezados de columna -->
        <g style="font:600 12px var(--mono);fill:var(--accent)" letter-spacing=".06em">
          <text x="40" y="40">PRODUCTORES · DENTRO DE LA PETICIÓN</text>
          <text x="470" y="40">COLA · POSTGRESQL</text>
          <text x="820" y="40">CONSUMIDOR · FUERA DE LA PETICIÓN</text>
        </g>
        <line x1="448" y1="24" x2="448" y2="560" style="stroke:var(--pkg-line)" stroke-dasharray="4 6"/>
        <line x1="758" y1="24" x2="758" y2="560" style="stroke:var(--pkg-line)" stroke-dasharray="4 6"/>

        <!-- productores -->
        <g style="fill:#FFFFFF;stroke:var(--pkg-line)">
          <rect x="40" y="70" width="270" height="70" rx="8"/>
          <rect x="40" y="155" width="270" height="70" rx="8"/>
          <rect x="40" y="240" width="270" height="70" rx="8"/>
          <rect x="40" y="325" width="270" height="70" rx="8"/>
        </g>
        <g style="font:600 13.5px var(--mono);fill:currentColor">
          <text x="56" y="98">UsuariosService</text>
          <text x="56" y="183">DonadorService</text>
          <text x="56" y="268">ConciliacionService</text>
          <text x="56" y="353">avisos de turnos</text>
        </g>
        <g style="font:12.5px var(--sans);fill:var(--muted)">
          <text x="56" y="121">invitar, restablecer contraseña</text>
          <text x="56" y="206">confirmar la cuenta del Donador</text>
          <text x="56" y="291">avisar que una donación se rechazó</text>
          <text x="56" y="376">recordar una reserva de turno</text>
        </g>
        <g style="stroke:currentColor;fill:none" stroke-width="1.6">
          <line x1="310" y1="105" x2="360" y2="105"/>
          <line x1="310" y1="190" x2="360" y2="190"/>
          <line x1="310" y1="275" x2="360" y2="275"/>
          <line x1="310" y1="360" x2="360" y2="360"/>
          <line x1="360" y1="105" x2="360" y2="360"/>
          <line x1="360" y1="232" x2="466" y2="232" marker-end="url(#f)"/>
        </g>
        <g style="font:12.5px var(--sans);fill:currentColor">
          <text x="370" y="214" style="font-weight:600">INSERT</text>
          <text x="370" y="256" style="fill:var(--muted)">misma</text>
          <text x="370" y="272" style="fill:var(--muted)">transacción</text>
        </g>

        <!-- respuesta al cliente -->
        <g style="stroke:currentColor;fill:none" stroke-width="1.6">
          <path d="M175 395 L175 440 L52 440" marker-end="url(#f)"/>
        </g>
        <g style="font:12.5px var(--sans);fill:currentColor">
          <text x="186" y="424" style="font-weight:600">responde al cliente</text>
          <text x="186" y="458" style="fill:var(--muted)">al confirmar la transacción,</text>
          <text x="186" y="474" style="fill:var(--muted)">sin esperar al servidor de correo</text>
        </g>

        <!-- cola -->
        <rect x="470" y="150" width="270" height="250" rx="8" style="fill:#FFFFFF;stroke:var(--accent)" stroke-width="2"/>
        <rect x="470" y="150" width="270" height="40" rx="8" style="fill:var(--accent-soft)"/>
        <rect x="470" y="178" width="270" height="12" style="fill:var(--accent-soft)"/>
        <text x="486" y="176" style="font:600 14px var(--mono);fill:currentColor">correo_saliente</text>
        <g style="stroke:var(--pkg-line)">
          <line x1="470" y1="260" x2="740" y2="260"/>
          <line x1="470" y1="330" x2="740" y2="330"/>
        </g>
        <g style="font:600 13px var(--mono);fill:currentColor">
          <text x="486" y="218">PENDIENTE</text>
          <text x="486" y="288">FALLIDO</text>
          <text x="486" y="358">ENVIADO</text>
        </g>
        <g style="font:12.5px var(--sans);fill:var(--muted)">
          <text x="486" y="238">recién encolado</text>
          <text x="486" y="308">vuelve a estar listo cuando</text>
          <text x="486" y="323">pasa enviar_despues_de</text>
          <text x="486" y="378">con enviado_en; no se toca más</text>
        </g>
        <text x="486" y="425" style="font:12.5px var(--sans);fill:var(--muted)">índice por (estado, enviar_despues_de)</text>

        <!-- consumidor -->
        <rect x="820" y="110" width="380" height="230" rx="8" style="fill:#FFFFFF;stroke:currentColor" stroke-width="1.6"/>
        <text x="836" y="140" style="font:600 14px var(--mono);fill:currentColor">procesarCola()</text>
        <text x="836" y="160" style="font:12.5px var(--sans);fill:var(--muted)">@Cron cada minuto · NotificacionService</text>
        <g style="font:600 11px var(--sans)" text-anchor="middle">
          <circle cx="845" cy="191" r="9" fill="#0F6E6E"/><text x="845" y="195" fill="#fff">1</text>
          <circle cx="845" cy="226" r="9" fill="#0F6E6E"/><text x="845" y="230" fill="#fff">2</text>
          <circle cx="845" cy="261" r="9" fill="#0F6E6E"/><text x="845" y="265" fill="#fff">3</text>
        </g>
        <g style="font:13px var(--sans);fill:currentColor">
          <text x="862" y="195">toma hasta 50 correos listos, del más viejo</text>
          <text x="862" y="230">envía cada uno por SMTP</text>
          <text x="862" y="265">ENVIADO si Resend lo acepta; si no, FALLIDO</text>
          <text x="862" y="282" style="fill:var(--muted)">y espera 1, 2, 4, 8… min (tope 2 h, máx. 8 intentos)</text>
        </g>
        <text x="836" y="322" style="font:12.5px var(--sans);fill:var(--muted)">bandera procesando: un lote a la vez por instancia</text>

        <!-- cola ⇄ consumidor -->
        <g style="stroke:currentColor;fill:none" stroke-width="1.6">
          <line x1="742" y1="205" x2="816" y2="205" marker-end="url(#f)"/>
          <line x1="818" y1="300" x2="744" y2="300" stroke-dasharray="6 4" marker-end="url(#f)"/>
        </g>
        <g style="font:12.5px var(--sans);fill:currentColor" text-anchor="middle">
          <text x="789" y="196">lee</text>
          <text x="789" y="292">marca</text>
        </g>

        <!-- Resend y bandeja -->
        <rect x="900" y="400" width="220" height="62" rx="8" style="fill:var(--pkg);stroke:var(--pkg-line)"/>
        <text x="916" y="426" style="font:600 13.5px var(--sans);fill:currentColor">Resend</text>
        <text x="916" y="446" style="font:12.5px var(--mono);fill:var(--muted)">smtp.resend.com:465</text>
        <rect x="900" y="510" width="220" height="50" rx="8" style="fill:var(--pkg);stroke:var(--pkg-line)"/>
        <text x="916" y="540" style="font:600 13.5px var(--sans);fill:currentColor">bandeja del destinatario</text>
        <g style="stroke:currentColor;fill:none" stroke-width="1.6">
          <line x1="1010" y1="342" x2="1010" y2="396" marker-end="url(#f)"/>
          <line x1="1010" y1="464" x2="1010" y2="506" marker-end="url(#f)"/>
        </g>
        <g style="font:12.5px var(--sans);fill:currentColor">
          <text x="1020" y="374">sendMail, TLS</text>
          <text x="1020" y="490">entrega</text>
        </g>

        <!-- línea de tiempo de la prueba del 30 de octubre -->
        <line x1="40" y1="600" x2="1200" y2="600" stroke="currentColor" stroke-width="1.4" marker-end="url(#f)"/>
        <text x="40" y="584" style="font:600 12px var(--mono);fill:var(--accent)" letter-spacing=".06em">PRUEBA REAL · 30 DE OCTUBRE, HORA DE COLOMBIA</text>
        <g fill="#0F6E6E">
          <circle cx="175" cy="600" r="6"/>
          <circle cx="605" cy="600" r="6"/>
          <circle cx="1010" cy="600" r="6"/>
        </g>
        <g style="font:12.5px var(--sans);fill:currentColor" text-anchor="middle">
          <text x="175" y="628" style="font-weight:600">05:50:11</text>
          <text x="175" y="646" style="fill:var(--muted)">registro del Donador: 202 y fila PENDIENTE</text>
          <text x="605" y="628" style="font-weight:600">en espera</text>
          <text x="605" y="646" style="fill:var(--muted)">la fila aguarda la siguiente pasada del cron</text>
          <text x="1010" y="628" style="font-weight:600">05:51:01</text>
          <text x="1010" y="646" style="fill:var(--muted)">ENVIADO en el primer intento; llegó a la bandeja</text>
        </g>
      </svg>
    </div>
    <figcaption>
      <p>La petición del usuario termina a la izquierda de la primera línea punteada; todo lo que está a la derecha ocurre después y en otro momento. Si el servidor de correo falla, la operación no se entera: el correo queda FALLIDO y se reintenta solo.</p>
    </figcaption>
  </figure>
</div>

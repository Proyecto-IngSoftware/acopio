<!DOCTYPE html>

<html class="h-full" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>C18 Códigos de barras - Consola Acopio</title>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#0F6E6E',
              dark: '#0A4F4F',
              light: '#E6F4F4',
              surface: '#F0F9F9'
            },
            admin: {
              DEFAULT: '#085046',
              dark: '#003730',
              container: '#b0efe1'
            },
            stone: {
              50: '#FAFAF9',
              100: '#F5F5F4',
              200: '#E7E5E4',
              300: '#D6D3D1',
              400: '#A8A29E',
              500: '#78716C',
              600: '#57534E',
              700: '#44403C',
              800: '#292524',
              900: '#1C1917',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    .material-symbols-outlined.fill-1 {
      font-variation-settings: 'FILL' 1;
    }
    .font-tabular {
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
    }
    /* Hide scrollbar for clean horizontal tabs */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-stone-50 text-stone-900 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-brand-light selection:text-brand-dark">
<!-- Mobile Container (390px centered) -->
<div class="w-full max-w-md mx-auto flex-1 flex flex-col min-h-screen bg-stone-50 shadow-sm relative">
<!-- 1. Cabecera con sesión compartida (Administrador Joseph Quintero) -->
<header class="w-full bg-stone-50 px-4 py-3 flex items-center justify-between border-b border-stone-200 sticky top-0 z-30">
<div class="flex items-center gap-2.5">
<div class="w-9 h-9 rounded-lg bg-admin flex items-center justify-center text-white shrink-0 shadow-sm">
<span class="material-symbols-outlined text-[20px]">inventory_2</span>
</div>
<div class="flex items-center gap-1.5">
<span class="text-[19px] font-bold tracking-tight text-stone-900">Acopio</span>
<span class="bg-[#b0efe1] text-admin font-bold text-[11px] leading-tight px-1.5 py-0.5 rounded tracking-wide">CO</span>
</div>
</div>
<button aria-label="Perfil Joseph Quintero" class="w-9 h-9 rounded-full bg-admin-dark flex items-center justify-center text-white font-bold text-[13px] shrink-0 shadow-sm active:scale-95 transition-transform" type="button">
        JQ
      </button>
</header>
<!-- Main Content -->
<main class="flex-1 pb-24">
<!-- 2. Subcabecera: Volver y Título -->
<div class="px-4 pt-4 pb-2">
<button class="inline-flex items-center gap-1 text-stone-600 hover:text-stone-900 text-[15px] font-medium py-1 -ml-1 transition-colors min-h-[44px]" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
<span>Volver</span>
</button>
<div class="flex items-center justify-between mt-1"><h1 class="text-[26px] font-bold text-stone-900 tracking-tight leading-tight">Catálogo</h1><button class="inline-flex items-center gap-1.5 px-3.5 py-2 bg-brand hover:bg-brand-dark text-white text-[13px] font-semibold rounded-lg shadow-sm transition-all" type="button"><span class="material-symbols-outlined text-[18px]">add</span><span>Agregar código</span></button></div>
<div class="mt-3 relative"><span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-400 text-[20px]">search</span><input class="w-full min-h-[44px] bg-white border border-stone-200 rounded-xl pl-10 pr-4 text-[14px] text-stone-900 placeholder-stone-400 focus:outline-none focus:border-brand shadow-sm" placeholder="Busca por número, categoría o presentación" type="text"/></div></div>
<!-- 3. Pestañas segmentadas desplazables (Categorías · Canasta · Emergencias · Códigos de barras) -->
<div class="px-4 mt-2">
<nav aria-label="Pestañas del catálogo" class="flex gap-2 overflow-x-auto no-scrollbar py-1 -mx-4 px-4 border-b border-stone-200"><button class="whitespace-nowrap px-3.5 py-2 text-[14px] font-medium text-stone-600 rounded-lg shrink-0" type="button">Categorías</button><button class="whitespace-nowrap px-3.5 py-2 text-[14px] font-bold text-brand bg-brand-light rounded-lg border-b-2 border-brand shrink-0" type="button">Códigos</button></nav>
</div>
<div class="px-4 mt-4 space-y-3">
<div class="p-1 bg-stone-200/80 rounded-xl flex gap-1">
<button class="flex-1 min-h-[40px] bg-white text-stone-900 rounded-lg text-[14px] font-semibold shadow-sm flex items-center justify-center gap-1.5" type="button"><span>Propuestos</span><span class="inline-flex items-center justify-center px-2 py-0.5 text-[11px] font-bold rounded-full bg-brand text-white leading-none">3</span></button>
<button class="flex-1 min-h-[40px] text-stone-600 rounded-lg text-[14px] font-medium" type="button">Todos</button>
</div>
</div>
<div class="px-4 mt-4 space-y-2.5">
<h2 class="text-[14px] font-bold text-stone-600 pt-1">Agua potable</h2>
<button class="w-full min-h-[56px] flex items-center gap-2 bg-white border border-stone-200 rounded-xl px-3.5 py-2 text-left" type="button"><span class="flex-1 text-[15px] font-semibold text-stone-900">Botella de agua 600 ml</span><span class="text-[12px] font-semibold rounded-full px-2.5 py-1 bg-stone-200 text-stone-700">4 códigos</span><span class="material-symbols-outlined text-[20px] text-stone-400">chevron_right</span></button>
<button class="w-full min-h-[56px] flex items-center gap-2 bg-white border border-stone-200 rounded-xl px-3.5 py-2 text-left" type="button"><span class="flex-1 text-[15px] font-semibold text-stone-900">Paquete x12 · botella 600 ml</span><span class="text-[12px] font-semibold rounded-full px-2.5 py-1 bg-amber-100 text-amber-800">1 propuesto</span><span class="material-symbols-outlined text-[20px] text-stone-400">chevron_right</span></button>
<h2 class="text-[14px] font-bold text-stone-600 pt-3">Arroz</h2>
<button class="w-full min-h-[56px] flex items-center gap-2 bg-white border border-stone-200 rounded-xl px-3.5 py-2 text-left" type="button"><span class="flex-1 text-[15px] font-semibold text-stone-900">Bolsa de arroz 500 g</span><span class="text-[12px] font-semibold rounded-full px-2.5 py-1 bg-amber-100 text-amber-800">2 propuestos</span><span class="material-symbols-outlined text-[20px] text-stone-400">chevron_right</span></button>
</div>
<div class="px-4 mt-5">
<button class="w-full min-h-[56px] bg-brand text-white text-[16px] font-bold rounded-[10px] flex items-center justify-center gap-2" type="button"><span class="material-symbols-outlined text-[22px]">add</span><span>Agregar código</span></button>
<p class="text-[13px] text-stone-500 mt-2 text-center">Escaneando o escribiendo el número</p>
</div>
</main>
<!-- 6. Barra de navegación inferior fija (5 pestañas, «Más» ACTIVA) -->
<nav aria-label="Navegación principal" class="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-stone-200 px-2 py-1 shadow-[0_-2px_10px_rgba(0,0,0,0.04)] max-w-md mx-auto">
<div class="grid grid-cols-5 items-center">
<!-- 1. Inicio -->
<a class="flex flex-col items-center justify-center min-h-[52px] py-1 text-stone-500 hover:text-stone-900 transition-colors" href="#">
<span class="material-symbols-outlined text-[24px]">home</span>
<span class="text-[11px] font-medium tracking-[0.015em] mt-0.5">Inicio</span>
</a>
<!-- 2. Mapa -->
<a class="flex flex-col items-center justify-center min-h-[52px] py-1 text-stone-500 hover:text-stone-900 transition-colors" href="#">
<span class="material-symbols-outlined text-[24px]">map</span>
<span class="text-[11px] font-medium tracking-[0.015em] mt-0.5">Mapa</span>
</a>
<!-- 3. Causas -->
<a class="flex flex-col items-center justify-center min-h-[52px] py-1 text-stone-500 hover:text-stone-900 transition-colors" href="#">
<span class="material-symbols-outlined text-[24px]">volunteer_activism</span>
<span class="text-[11px] font-medium tracking-[0.015em] mt-0.5">Causas</span>
</a>
<!-- 4. Voluntariado -->
<a class="flex flex-col items-center justify-center min-h-[52px] py-1 text-stone-500 hover:text-stone-900 transition-colors" href="#">
<span class="material-symbols-outlined text-[24px]">groups</span>
<span class="text-[11px] font-medium tracking-[0.015em] mt-0.5">Voluntariado</span>
</a>
<!-- 5. Más (ACTIVO) -->
<a class="flex flex-col items-center justify-center min-h-[52px] py-1 text-brand font-semibold relative" href="#">
<div class="w-12 h-7 bg-[#b0efe1] text-admin-dark rounded-full flex items-center justify-center mb-0.5 transition-colors">
<span class="material-symbols-outlined text-[22px] fill-1">more_horiz</span>
</div>
<span class="text-[11px] font-bold tracking-[0.015em] text-admin-dark">Más</span>
</a>
</div>
</nav>
</div>
</body>
</html>
